<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Logo Creator – aus Bildern transparente Logos und Icon-Sets erzeugen." />
    <title>Logo Creator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 22V10h4.6c2.6 0 4.4 1.6 4.4 4s-1.8 4-4.4 4H12v4H9z' fill='white'/%3E%3Ccircle cx='22' cy='20' r='3' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Theme vor dem ersten Paint setzen, um Flash zu vermeiden.
      (function () {
        try {
          var stored = localStorage.getItem('logo-creator:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
